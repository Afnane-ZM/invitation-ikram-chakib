<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitation de Mariage</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">

    <!-- Icônes -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

<div class="background"></div>

<!-- Enveloppe -->
<section id="welcome">

    <h3 class="subtitle">Invitation de Mariage</h3>

    <h1 class="initials">I & C</h1>

    <div class="envelope-wrap" id="envelope">
        <img src="images/enveloppe.jpg" alt="Enveloppe" class="envelope-img">
    </div>

    <p class="click-text">
        Cliquez sur l'enveloppe
    </p>

</section>

<!-- Invitation -->

<section id="invitation" class="hidden">

    <div class="card">

        <img src="images/invitation.png" alt="Invitation de mariage" class="invitation-img">

        <div class="buttons">

            <a href="https://maps.app.goo.gl/qsuFF3Z7oF66edoC8"
               target="_blank"
               class="btn">

               📍 Localisation

            </a>

        </div>

    </div>

</section>

<script src="script.js"></script>

</body>
</html>
