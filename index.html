<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitation de Mariage</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">

    <!-- Icônes -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

<div class="background"></div>

<!-- Enveloppe -->
<section id="welcome">

    <h3 class="subtitle">Invitation de Mariage</h3>

    <h1 class="initials">I & C</h1>

    <div class="envelope-wrap">

        <div class="lace"></div>

        <div class="envelope" id="envelope">

            <div class="top"></div>

            <div class="letter">
                Ouvrir
            </div>

            <div class="seal">
                <svg viewBox="0 0 24 24">
                    <path d="M12 3c1 3 1 5 0 8c-1-3-1-5 0-8Z"/>
                    <path d="M12 11v9"/>
                    <path d="M12 15c-2-1-3-1-4 0"/>
                    <path d="M12 17c2-1 3-1 4 0"/>
                </svg>
                <span class="monogram">I &amp; C</span>
            </div>

        </div>

    </div>

    <p class="click-text">
        Cliquez sur l'enveloppe
    </p>

</section>

<!-- Invitation -->

<section id="invitation" class="hidden">

    <div class="card">

        <h4>Au nom de Dieu</h4>

        <h1>Ikram</h1>

        <span>&</span>

        <h1>Chakib</h1>

        <p class="message">

            Ont l'immense joie de vous inviter
            à célébrer leur union.

        </p>

        <div class="info">

            <p>
                <i class="fa-solid fa-calendar"></i>
                Vendredi 18 Septembre 2026
            </p>

            <p>
                <i class="fa-solid fa-clock"></i>
                18:00
            </p>

            <p>
                <i class="fa-solid fa-location-dot"></i>
                Salle des fêtes Assinate
            </p>

        </div>

        <div class="buttons">

            <a href="https://maps.app.goo.gl/qsuFF3Z7oF66edoC8"
               target="_blank"
               class="btn">

               📍 Localisation

            </a>

        </div>

    </div>

</section>

<script src="script.js"></script>

</body>
</html>
