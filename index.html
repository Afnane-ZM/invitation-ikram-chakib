<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitation de Mariage</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">

    <!-- Icônes -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

<div class="background"></div>

<!-- Enveloppe -->
<section id="welcome">

    <h3 class="subtitle">Wedding Invitation</h3>

    <h1 class="initials">I & C</h1>

    <div class="envelope" id="envelope">

        <div class="top"></div>

        <div class="letter">

            <h2>Open</h2>

        </div>

    </div>

    <p class="click-text">
        Cliquez sur l'enveloppe
    </p>

</section>

<!-- Invitation -->

<section id="invitation" class="hidden">

    <div class="card">

        <h4>Au nom de Dieu</h4>

        <h1>Ikram</h1>

        <span>&</span>

        <h1>Chakib</h1>

        <p class="message">

            Ont l'immense joie de vous inviter
            à célébrer leur union.

        </p>

        <div class="info">

            <p>
                <i class="fa-solid fa-calendar"></i>
                Samedi 15 Novembre 2026
            </p>

            <p>
                <i class="fa-solid fa-clock"></i>
                18:00
            </p>

            <p>
                <i class="fa-solid fa-location-dot"></i>
                Salle El Andalous
            </p>

        </div>

        <div class="buttons">

            <a href="invitation.pdf"
               target="_blank"
               class="btn">

               📄 Télécharger le PDF

            </a>

            <a href="https://maps.app.goo.gl/qsuFF3Z7oF66edoC8"
               target="_blank"
               class="btn">

               📍 Localisation

            </a>

            <a href="https://wa.me/213000000000"
               target="_blank"
               class="btn">

               💬 RSVP

            </a>

        </div>

    </div>

</section>

<script src="script.js"></script>

</body>
</html>
